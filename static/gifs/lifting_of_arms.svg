<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="200" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Lifting of Arms</text>
  
  <!-- Starting position -->
  <g>
    <text x="100" y="80" font-size="14" font-weight="bold" fill="#666">1. Start</text>
    <!-- Head -->
    <circle cx="100" cy="110" r="12" fill="#667eea"/>
    <!-- Body -->
    <line x1="100" y1="125" x2="100" y2="170" stroke="#667eea" stroke-width="3"/>
    <!-- Arms down -->
    <line x1="100" y1="135" x2="70" y2="180" stroke="#667eea" stroke-width="2"/>
    <line x1="100" y1="135" x2="130" y2="180" stroke="#667eea" stroke-width="2"/>
    <!-- Legs -->
    <line x1="100" y1="170" x2="85" y2="220" stroke="#28a745" stroke-width="3"/>
    <line x1="100" y1="170" x2="115" y2="220" stroke="#28a745" stroke-width="3"/>
  </g>
  
  <!-- Lifted position -->
  <g>
    <text x="300" y="80" font-size="14" font-weight="bold" fill="#666">2. Lift</text>
    <!-- Head -->
    <circle cx="300" cy="110" r="12" fill="#667eea"/>
    <!-- Body -->
    <line x1="300" y1="125" x2="300" y2="170" stroke="#667eea" stroke-width="3"/>
    <!-- Arms up -->
    <line x1="300" y1="135" x2="270" y2="90" stroke="#667eea" stroke-width="2"/>
    <line x1="300" y1="135" x2="330" y2="90" stroke="#667eea" stroke-width="2"/>
    <!-- Legs -->
    <line x1="300" y1="170" x2="285" y2="220" stroke="#28a745" stroke-width="3"/>
    <line x1="300" y1="170" x2="315" y2="220" stroke="#28a745" stroke-width="3"/>
  </g>
  
  <!-- Instructions -->
  <text x="200" y="450" font-size="12" text-anchor="middle" fill="#888">Raise arms from sides to shoulder height</text>
  <text x="200" y="475" font-size="12" text-anchor="middle" fill="#888">Keep elbows slightly bent, palms forward</text>
</svg>