<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="tg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>
  <rect width="300" height="400" rx="16" fill="url(#bg)"/>
  <text x="150" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#92400e">Trunk Rotation &amp; Target Touch</text>

  <!-- Target circles (left side) -->
  <g opacity="0.4">
    <circle cx="42" cy="160" r="18" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="42" cy="160" r="10" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="42" cy="160" r="3" fill="#dc2626"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" additive="sum"/>
  </g>
  <!-- Target circles (right side) -->
  <g opacity="0.4">
    <circle cx="258" cy="160" r="18" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="258" cy="160" r="10" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="258" cy="160" r="3" fill="#dc2626"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Rotation arc indicator -->
  <path d="M80,125 A70,20 0 0,1 220,125" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" opacity="0.35"/>
  <text x="68" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#b45309" opacity="0.6">↺</text>
  <text x="222" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#b45309" opacity="0.6">↻</text>

  <!-- Head -->
  <circle cx="150" cy="85" r="20" fill="#fef3c7" stroke="#92400e" stroke-width="3">
    <animateTransform attributeName="transform" type="translate" values="0,0;-10,0;0,0;10,0;0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <!-- Eyes - move with head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-10,0;0,0;10,0;0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <circle cx="143" cy="81" r="2" fill="#92400e"/><circle cx="157" cy="81" r="2" fill="#92400e"/>
    <path d="M144,90 Q150,95 156,90" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Neck -->
  <line x1="150" y1="105" x2="150" y2="118" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>

  <!-- Torso (stationary lower half) -->
  <line x1="150" y1="170" x2="150" y2="230" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>

  <!-- Upper torso + shoulders (rotating) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-16,0;0,0;16,0;0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>

    <!-- Upper torso -->
    <line x1="150" y1="118" x2="150" y2="170" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>

    <!-- Shoulder line -->
    <line y1="128" y2="128" stroke="#b45309" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="110;94;110;126;110" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="190;206;190;174;190" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>

    <!-- Left arm reaching toward target -->
    <line y1="128" stroke="#b45309" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="110;94;110;126;110" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="90;52;90;108;90" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="168;162;168;172;168" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>
    <!-- Left hand (target touch indicator) -->
    <circle r="6" fill="#dc2626" opacity="0.7">
      <animate attributeName="cx" values="90;52;90;108;90" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="cy" values="168;162;168;172;168" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0.5;1;0.5;0.3;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Right arm reaching toward target -->
    <line y1="128" stroke="#b45309" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="190;206;190;174;190" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="210;248;210;192;210" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="168;162;168;172;168" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>
    <!-- Right hand (target touch indicator) -->
    <circle r="6" fill="#dc2626" opacity="0.7">
      <animate attributeName="cx" values="210;248;210;192;210" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="cy" values="168;162;168;172;168" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Shoulder joints -->
    <circle cy="128" r="5" fill="#b45309">
      <animate attributeName="cx" values="110;94;110;126;110" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
    <circle cy="128" r="5" fill="#b45309">
      <animate attributeName="cx" values="190;206;190;174;190" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
  </g>

  <!-- Hip (stationary) -->
  <circle cx="150" cy="230" r="5" fill="#92400e"/>
  <!-- Left leg -->
  <line x1="150" y1="230" x2="122" y2="305" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="305" x2="118" y2="358" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="122" cy="305" r="4" fill="#92400e"/>
  <line x1="118" y1="358" x2="106" y2="360" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="150" y1="230" x2="178" y2="305" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <line x1="178" y1="305" x2="182" y2="358" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="178" cy="305" r="4" fill="#92400e"/>
  <line x1="182" y1="358" x2="194" y2="360" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>

  <!-- "Touch!" pulse text -->
  <text x="50" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#dc2626">
    Touch!
    <animate attributeName="opacity" values="0;1;0;0;0" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="250" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#dc2626">
    Touch!
    <animate attributeName="opacity" values="0;0;0;1;0" dur="4s" repeatCount="indefinite"/>
  </text>

  <rect x="16" y="372" width="268" height="22" rx="11" fill="#b45309" opacity="0.12"/>
  <text x="150" y="387" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#92400e">Rotate trunk &amp; touch targets alternately</text>
</svg>
