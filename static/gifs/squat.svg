<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" rx="16" fill="url(#bg)"/>
  <text x="150" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#1e40af">Squat</text>

  <!-- Depth guide lines -->
  <line x1="60" y1="230" x2="240" y2="230" stroke="#059669" stroke-width="0.8" stroke-dasharray="5,4" opacity="0.3"/>
  <text x="245" y="234" font-family="system-ui,sans-serif" font-size="7" fill="#059669" opacity="0.5">hip level</text>
  <line x1="60" y1="290" x2="240" y2="290" stroke="#059669" stroke-width="0.8" stroke-dasharray="5,4" opacity="0.3"/>
  <text x="245" y="294" font-family="system-ui,sans-serif" font-size="7" fill="#059669" opacity="0.5">knee level</text>

  <!-- Down arrow -->
  <path d="M265,160 L265,260" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.45"/>
  <polygon points="265,264 261,256 269,256" fill="#059669" opacity="0.45"/>
  <path d="M265,264 L265,170" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" opacity="0.25"/>
  <polygon points="265,166 261,174 269,174" fill="#059669" opacity="0.25"/>

  <!-- HEAD (animated y position - moves down during squat) -->
  <circle cx="150" r="20" fill="#dbeafe" stroke="#1e40af" stroke-width="3">
    <animate attributeName="cy" values="85;115;85" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <g>
    <animate attributeName="opacity" values="1;1;1" dur="3.5s" repeatCount="indefinite"/>
    <circle cx="143" r="2" fill="#1e40af">
      <animate attributeName="cy" values="81;111;81" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
    <circle cx="157" r="2" fill="#1e40af">
      <animate attributeName="cy" values="81;111;81" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
  </g>

  <!-- Neck -->
  <line x1="150" x2="150" stroke="#1e40af" stroke-width="4" stroke-linecap="round">
    <animate attributeName="y1" values="105;135;105" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="118;148;118" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- Torso (moves down but stays same length) -->
  <line x1="150" x2="150" stroke="#059669" stroke-width="5" stroke-linecap="round">
    <animate attributeName="y1" values="118;148;118" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="230;260;230" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- Shoulder line -->
  <line stroke="#059669" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x1" values="115;115;115" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="185;185;185" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="128;158;128" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="128;158;128" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- Arms (hands on hips during squat) -->
  <!-- Left arm -->
  <line stroke="#1e40af" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x1" values="115;115;115" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="128;158;128" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="105;105;105" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="175;205;175" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>
  <line stroke="#1e40af" stroke-width="3.5" stroke-linecap="round">
    <animate attributeName="x1" values="105;105;105" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="175;205;175" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="120;120;120" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="200;230;200" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>
  <!-- Right arm -->
  <line stroke="#1e40af" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x1" values="185;185;185" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="128;158;128" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="195;195;195" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="175;205;175" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>
  <line stroke="#1e40af" stroke-width="3.5" stroke-linecap="round">
    <animate attributeName="x1" values="195;195;195" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="175;205;175" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="180;180;180" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="200;230;200" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- Hip joint -->
  <circle cx="150" r="5" fill="#059669">
    <animate attributeName="cy" values="230;260;230" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>

  <!-- Left leg - thigh -->
  <line stroke="#059669" stroke-width="5" stroke-linecap="round">
    <animate attributeName="x1" values="150;150;150" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="230;260;230" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="122;105;122" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="305;295;305" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>
  <!-- Left leg - shin -->
  <line stroke="#059669" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x1" values="122;105;122" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y1" values="305;295;305" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="118;110;118" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="358;358;358" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <!-- Left knee -->
  <circle r="5" fill="#059669">
    <animate attributeName="cx" values="122;105;122" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="cy" values="305;295;305" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <!-- Left foot -->
  <line stroke="#1e40af" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x1" values="118;110;118" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y1" values="358;358;358" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="106;98;106" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="360;360;360" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- Right leg - thigh -->
  <line stroke="#059669" stroke-width="5" stroke-linecap="round">
    <animate attributeName="x1" values="150;150;150" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="230;260;230" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="178;195;178" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="305;295;305" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>
  <!-- Right leg - shin -->
  <line stroke="#059669" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x1" values="178;195;178" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y1" values="305;295;305" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="182;190;182" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="358;358;358" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <!-- Right knee -->
  <circle r="5" fill="#059669">
    <animate attributeName="cx" values="178;195;178" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="cy" values="305;295;305" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <!-- Right foot -->
  <line stroke="#1e40af" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x1" values="182;190;182" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y1" values="358;358;358" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="194;202;194" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="y2" values="360;360;360" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <rect x="22" y="372" width="256" height="22" rx="11" fill="#059669" opacity="0.12"/>
  <text x="150" y="387" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#059669">Lower hips to knee level, keep back straight</text>
</svg>
