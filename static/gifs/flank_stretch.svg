<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="200" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Flank Stretch</text>
  
  <!-- Right stretch -->
  <g>
    <text x="100" y="80" font-size="14" font-weight="bold" fill="#666">1. Right Side</text>
    <!-- Head -->
    <circle cx="100" cy="110" r="12" fill="#667eea"/>
    <!-- Body tilted right -->
    <line x1="100" y1="125" x2="120" y2="180" stroke="#667eea" stroke-width="4"/>
    <!-- Arms (left up, right down) -->
    <line x1="100" y1="135" x2="70" y2="80" stroke="#667eea" stroke-width="2"/>
    <line x1="100" y1="135" x2="130" y2="170" stroke="#667eea" stroke-width="2"/>
    <!-- Legs -->
    <line x1="100" y1="180" x2="85" y2="230" stroke="#28a745" stroke-width="3"/>
    <line x1="100" y1="180" x2="115" y2="230" stroke="#28a745" stroke-width="3"/>
  </g>
  
  <!-- Left stretch -->
  <g>
    <text x="300" y="80" font-size="14" font-weight="bold" fill="#666">2. Left Side</text>
    <!-- Head -->
    <circle cx="300" cy="110" r="12" fill="#667eea"/>
    <!-- Body tilted left -->
    <line x1="300" y1="125" x2="280" y2="180" stroke="#667eea" stroke-width="4"/>
    <!-- Arms (left down, right up) -->
    <line x1="300" y1="135" x2="270" y2="170" stroke="#667eea" stroke-width="2"/>
    <line x1="300" y1="135" x2="330" y2="80" stroke="#667eea" stroke-width="2"/>
    <!-- Legs -->
    <line x1="300" y1="180" x2="285" y2="230" stroke="#28a745" stroke-width="3"/>
    <line x1="300" y1="180" x2="315" y2="230" stroke="#28a745" stroke-width="3"/>
  </g>
  
  <!-- Instructions -->
  <text x="200" y="450" font-size="12" text-anchor="middle" fill="#888">Reach one arm overhead while tilting torso</text>
  <text x="200" y="475" font-size="12" text-anchor="middle" fill="#888">Feel stretch along side of body</text>
</svg>