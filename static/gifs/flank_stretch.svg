<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" rx="16" fill="url(#bg)"/>
  <text x="150" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#be123c">Flank Stretch (ELK)</text>

  <!-- Stretch zone indicators -->
  <text x="70" y="58" font-family="system-ui,sans-serif" font-size="9" fill="#059669" opacity="0.6">← stretch</text>
  <text x="195" y="58" font-family="system-ui,sans-serif" font-size="9" fill="#059669" opacity="0.6">stretch →</text>

  <!-- ANIMATED UPPER BODY - side stretch with overhead arm -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 150 230;-18 150 230;0 150 230;18 150 230;0 150 230" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>

    <!-- Head -->
    <circle cx="150" cy="85" r="20" fill="#fecdd3" stroke="#be123c" stroke-width="3"/>
    <circle cx="143" cy="81" r="2" fill="#be123c"/><circle cx="157" cy="81" r="2" fill="#be123c"/>
    <path d="M144,90 Q150,95 156,90" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neck -->
    <line x1="150" y1="105" x2="150" y2="118" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>

    <!-- Torso -->
    <line x1="150" y1="118" x2="150" y2="230" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

    <!-- Shoulder line -->
    <line x1="112" y1="128" x2="188" y2="128" stroke="#059669" stroke-width="4" stroke-linecap="round"/>

    <!-- Left arm - goes OVERHEAD during stretch -->
    <line x1="112" y1="128" stroke="#059669" stroke-width="4.5" stroke-linecap="round">
      <animate attributeName="x2" values="95;120;95;95;95" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="190;72;190;190;190" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>
    <line stroke="#059669" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="95;120;95;95;95" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y1" values="190;72;190;190;190" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="82;160;82;82;82" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="245;62;245;245;245" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>

    <!-- Right arm - goes OVERHEAD during opposite stretch -->
    <line x1="188" y1="128" stroke="#059669" stroke-width="4.5" stroke-linecap="round">
      <animate attributeName="x2" values="205;205;205;180;205" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="190;190;190;72;190" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>
    <line stroke="#059669" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="205;205;205;180;205" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y1" values="190;190;190;72;190" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="218;218;218;140;218" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="245;245;245;62;245" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>

    <!-- Shoulder joints -->
    <circle cx="112" cy="128" r="5" fill="#059669"/>
    <circle cx="188" cy="128" r="5" fill="#059669"/>
  </g>

  <!-- Hip (stationary) -->
  <circle cx="150" cy="230" r="5" fill="#be123c"/>

  <!-- Left leg -->
  <line x1="150" y1="230" x2="122" y2="305" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="305" x2="118" y2="358" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="122" cy="305" r="4" fill="#be123c"/>
  <line x1="118" y1="358" x2="106" y2="360" stroke="#be123c" stroke-width="3" stroke-linecap="round"/>

  <!-- Right leg -->
  <line x1="150" y1="230" x2="178" y2="305" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>
  <line x1="178" y1="305" x2="182" y2="358" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="178" cy="305" r="4" fill="#be123c"/>
  <line x1="182" y1="358" x2="194" y2="360" stroke="#be123c" stroke-width="3" stroke-linecap="round"/>

  <rect x="22" y="372" width="256" height="22" rx="11" fill="#059669" opacity="0.12"/>
  <text x="150" y="387" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#059669">Side bend 15-25° each side, slowly</text>
</svg>
