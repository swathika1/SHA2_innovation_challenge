<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="200" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Pelvis Rotation</text>
  
  <!-- Neutral position -->
  <g>
    <text x="100" y="80" font-size="14" font-weight="bold" fill="#666">1. Neutral</text>
    <!-- Head -->
    <circle cx="100" cy="110" r="12" fill="#667eea"/>
    <!-- Body -->
    <line x1="100" y1="125" x2="100" y2="170" stroke="#667eea" stroke-width="3"/>
    <!-- Pelvis (rectangle) -->
    <rect x="75" y="165" width="50" height="20" fill="none" stroke="#28a745" stroke-width="2"/>
    <!-- Arms -->
    <line x1="100" y1="135" x2="70" y2="120" stroke="#667eea" stroke-width="2"/>
    <line x1="100" y1="135" x2="130" y2="120" stroke="#667eea" stroke-width="2"/>
    <!-- Legs -->
    <line x1="85" y1="185" x2="75" y2="225" stroke="#28a745" stroke-width="2"/>
    <line x1="115" y1="185" x2="125" y2="225" stroke="#28a745" stroke-width="2"/>
  </g>
  
  <!-- Rotated position -->
  <g>
    <text x="300" y="80" font-size="14" font-weight="bold" fill="#666">2. Rotate</text>
    <!-- Head -->
    <circle cx="300" cy="110" r="12" fill="#667eea"/>
    <!-- Body -->
    <line x1="300" y1="125" x2="300" y2="170" stroke="#667eea" stroke-width="3"/>
    <!-- Pelvis (rotated) -->
    <g transform="translate(300, 175) rotate(30)">
      <rect x="-25" y="-10" width="50" height="20" fill="none" stroke="#28a745" stroke-width="2"/>
    </g>
    <!-- Arms -->
    <line x1="300" y1="135" x2="270" y2="120" stroke="#667eea" stroke-width="2"/>
    <line x1="300" y1="135" x2="330" y2="120" stroke="#667eea" stroke-width="2"/>
    <!-- Legs -->
    <line x1="285" y1="185" x2="275" y2="225" stroke="#28a745" stroke-width="2"/>
    <line x1="315" y1="185" x2="325" y2="225" stroke="#28a745" stroke-width="2"/>
  </g>
  
  <!-- Instructions -->
  <text x="200" y="450" font-size="12" text-anchor="middle" fill="#888">Rotate pelvis while keeping upper body stable</text>
  <text x="200" y="475" font-size="12" text-anchor="middle" fill="#888">Move hips in circular motion</text>
</svg>