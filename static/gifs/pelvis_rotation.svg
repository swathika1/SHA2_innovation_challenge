<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" rx="16" fill="url(#bg)"/>
  <text x="150" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#1e40af">Pelvis Rotation</text>

  <!-- Rotation arc at hip level -->
  <path d="M105,230 A45,16 0 0,1 195,230" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" opacity="0.35"/>
  <text x="92" y="226" font-family="system-ui,sans-serif" font-size="9" fill="#059669" opacity="0.6">↺</text>
  <text x="199" y="226" font-family="system-ui,sans-serif" font-size="9" fill="#059669" opacity="0.6">↻</text>

  <!-- Head (stationary) -->
  <circle cx="150" cy="85" r="20" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
  <circle cx="143" cy="81" r="2" fill="#1e40af"/><circle cx="157" cy="81" r="2" fill="#1e40af"/>
  <path d="M144,90 Q150,95 156,90" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Neck -->
  <line x1="150" y1="105" x2="150" y2="118" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>

  <!-- Upper torso (stationary) -->
  <line x1="150" y1="118" x2="150" y2="175" stroke="#1e40af" stroke-width="5" stroke-linecap="round"/>
  <line x1="112" y1="128" x2="188" y2="128" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>

  <!-- Arms (stationary - hands on hips) -->
  <line x1="112" y1="128" x2="102" y2="180" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  <line x1="102" y1="180" x2="122" y2="215" stroke="#1e40af" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="188" y1="128" x2="198" y2="180" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  <line x1="198" y1="180" x2="178" y2="215" stroke="#1e40af" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="112" cy="128" r="4" fill="#1e40af"/>
  <circle cx="188" cy="128" r="4" fill="#1e40af"/>

  <!-- LOWER TORSO + PELVIS (rotating) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-10,0;0,0;10,0;0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>

    <!-- Lower torso -->
    <line x1="150" y1="175" x2="150" y2="230" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

    <!-- Hip line (pelvis) -->
    <line y1="230" y2="230" stroke="#059669" stroke-width="5" stroke-linecap="round">
      <animate attributeName="x1" values="130;120;130;140;130" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="170;180;170;160;170" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>

    <!-- Hip center -->
    <circle cx="150" cy="230" r="6" fill="#059669"/>

    <!-- Left leg -->
    <line y1="230" stroke="#059669" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="130;120;130;140;130" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="115;105;115;125;115" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="305;305;305;305;305" dur="4s" repeatCount="indefinite"/>
    </line>
    <line y1="305" stroke="#059669" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="115;105;115;125;115" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="112;102;112;122;112" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="358;358;358;358;358" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Left knee -->
    <circle cy="305" r="4" fill="#059669">
      <animate attributeName="cx" values="115;105;115;125;115" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>

    <!-- Right leg -->
    <line y1="230" stroke="#059669" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="170;180;170;160;170" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="185;195;185;175;185" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="305;305;305;305;305" dur="4s" repeatCount="indefinite"/>
    </line>
    <line y1="305" stroke="#059669" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x1" values="185;195;185;175;185" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="188;198;188;178;188" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="y2" values="358;358;358;358;358" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Right knee -->
    <circle cy="305" r="4" fill="#059669">
      <animate attributeName="cx" values="185;195;185;175;185" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>

    <!-- Feet -->
    <line y1="358" y2="360" stroke="#1e40af" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="112;102;112;122;112" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="100;90;100;110;100" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>
    <line y1="358" y2="360" stroke="#1e40af" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="188;198;188;178;188" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="x2" values="200;210;200;190;200" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </line>
  </g>

  <rect x="18" y="372" width="264" height="22" rx="11" fill="#059669" opacity="0.12"/>
  <text x="150" y="387" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#059669">Rotate pelvis gently, keep shoulders stable</text>
</svg>
