<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" rx="16" fill="url(#bg)"/>
  <text x="150" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#1e40af">Lateral Trunk Tilt</text>

  <!-- Tilt zone indicator -->
  <path d="M100,60 L150,50 L200,60" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="85" y="58" font-family="system-ui,sans-serif" font-size="8" fill="#059669" opacity="0.6">←</text>
  <text x="210" y="58" font-family="system-ui,sans-serif" font-size="8" fill="#059669" opacity="0.6">→</text>

  <!-- Animated upper body group (head + neck + torso + arms tilt) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 150 230;-15 150 230;0 150 230;15 150 230;0 150 230" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>

    <!-- Head -->
    <circle cx="150" cy="85" r="20" fill="#dbeafe" stroke="#059669" stroke-width="3"/>
    <circle cx="143" cy="81" r="2" fill="#1e40af"/><circle cx="157" cy="81" r="2" fill="#1e40af"/>
    <path d="M144,90 Q150,95 156,90" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neck -->
    <line x1="150" y1="105" x2="150" y2="118" stroke="#059669" stroke-width="4" stroke-linecap="round"/>

    <!-- Torso (active - green) -->
    <line x1="150" y1="118" x2="150" y2="230" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

    <!-- Shoulder line -->
    <line x1="112" y1="128" x2="188" y2="128" stroke="#059669" stroke-width="4" stroke-linecap="round"/>

    <!-- Left arm -->
    <line x1="112" y1="128" x2="92" y2="190" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <line x1="92" y1="190" x2="82" y2="245" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="92" cy="190" r="3.5" fill="#059669"/>

    <!-- Right arm -->
    <line x1="188" y1="128" x2="208" y2="190" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <line x1="208" y1="190" x2="218" y2="245" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="208" cy="190" r="3.5" fill="#059669"/>

    <!-- Shoulder joints -->
    <circle cx="112" cy="128" r="5" fill="#059669"/>
    <circle cx="188" cy="128" r="5" fill="#059669"/>
  </g>

  <!-- Hip (stationary) -->
  <circle cx="150" cy="230" r="5" fill="#1e40af"/>

  <!-- Left leg (stationary) -->
  <line x1="150" y1="230" x2="122" y2="305" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="305" x2="118" y2="358" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  <circle cx="122" cy="305" r="4" fill="#1e40af"/>
  <line x1="118" y1="358" x2="106" y2="360" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>

  <!-- Right leg (stationary) -->
  <line x1="150" y1="230" x2="178" y2="305" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  <line x1="178" y1="305" x2="182" y2="358" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  <circle cx="178" cy="305" r="4" fill="#1e40af"/>
  <line x1="182" y1="358" x2="194" y2="360" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>

  <!-- Instruction -->
  <rect x="22" y="372" width="256" height="22" rx="11" fill="#059669" opacity="0.12"/>
  <text x="150" y="387" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#059669">Tilt trunk ~20-30° to each side slowly</text>
</svg>
