<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SHA2 Rehab Coach{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='rehab-logo.png', v='1') }}">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Large, Readable -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Animated particle background canvas -->
    <canvas id="bgParticles" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div class="page-wrapper">
        {% block header %}{% endblock %}
        
        <main class="container">
            {% block content %}{% endblock %}
        </main>
        
        {% block footer %}{% endblock %}
    </div>
    
    {% block scripts %}{% endblock %}

    <script>
    /* ============================================================
       NEON PARTICLE SYSTEM — comets, sparks, electric web
       ============================================================ */
    (function() {
        const canvas = document.getElementById('bgParticles');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        // Vivid neon palette
        const NEON = [
            '#a78bfa','#818cf8','#38bdf8','#22d3ee',
            '#f472b6','#fb7185','#34d399','#4ade80',
            '#facc15','#fb923c'
        ];
        const NUM_STARS  = 70;   // fast-moving comets
        const NUM_NODES  = 30;   // web nodes
        const MAX_DIST   = 180;
        let W, H, stars = [], nodes = [], sparks = [];

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        /* ---- Comet / star ---- */
        function Star() {
            this.reset();
        }
        Star.prototype.reset = function(full) {
            this.x     = full ? Math.random() * W : Math.random() * W;
            this.y     = full ? Math.random() * H : -10;
            this.size  = Math.random() * 2.5 + 0.8;
            this.speed = Math.random() * 2.5 + 0.8;
            this.color = NEON[Math.floor(Math.random() * NEON.length)];
            this.angle = Math.PI / 2 + (Math.random() - 0.5) * 0.6;
            this.trail = [];
            this.alpha = Math.random() * 0.8 + 0.4;
        };
        Star.prototype.update = function() {
            this.trail.unshift({ x: this.x, y: this.y });
            if (this.trail.length > 18) this.trail.pop();
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            if (this.y > H + 20 || this.x < -20 || this.x > W + 20) this.reset(false);
        };
        Star.prototype.draw = function() {
            // Trail
            for (let i = 0; i < this.trail.length; i++) {
                const progress = 1 - i / this.trail.length;
                ctx.beginPath();
                ctx.arc(this.trail[i].x, this.trail[i].y, this.size * progress * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = progress * this.alpha * 0.5;
                ctx.fill();
            }
            // Head
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.alpha;
            ctx.shadowColor  = this.color;
            ctx.shadowBlur   = 14;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur  = 0;
        };

        /* ---- Web node ---- */
        function Node() {
            this.x     = Math.random() * W;
            this.y     = Math.random() * H;
            this.vx    = (Math.random() - 0.5) * 0.6;
            this.vy    = (Math.random() - 0.5) * 0.6;
            this.r     = Math.random() * 3 + 1.5;
            this.color = NEON[Math.floor(Math.random() * NEON.length)];
            this.pulse = Math.random() * Math.PI * 2;
        }
        Node.prototype.update = function() {
            this.x += this.vx;
            this.y += this.vy;
            this.pulse += 0.04;
            if (this.x < 0 || this.x > W) this.vx *= -1;
            if (this.y < 0 || this.y > H) this.vy *= -1;
        };
        Node.prototype.draw = function() {
            const a = 0.4 + 0.25 * Math.sin(this.pulse);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = a;
            ctx.shadowColor  = this.color;
            ctx.shadowBlur   = 18;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur  = 0;
        };

        /* ---- Spark burst (random triggers) ---- */
        function spawnSpark() {
            const color = NEON[Math.floor(Math.random() * NEON.length)];
            const cx = Math.random() * W;
            const cy = Math.random() * H;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                sparks.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * (Math.random() * 3 + 1),
                    vy: Math.sin(angle) * (Math.random() * 3 + 1),
                    life: 1, color
                });
            }
        }

        function init() {
            resize();
            stars = [];
            nodes = [];
            for (let i = 0; i < NUM_STARS; i++) {
                const s = new Star();
                s.reset(true);   // distribute across screen at start
                stars.push(s);
            }
            for (let i = 0; i < NUM_NODES; i++) nodes.push(new Node());
        }

        let frame = 0;
        function loop() {
            ctx.clearRect(0, 0, W, H);
            frame++;

            // Occasional spark burst
            if (frame % 120 === 0) spawnSpark();

            // Update & draw web lines between nodes
            nodes.forEach(n => n.update());
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const d  = Math.sqrt(dx*dx + dy*dy);
                    if (d < MAX_DIST) {
                        const frac = 1 - d / MAX_DIST;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = nodes[i].color;
                        ctx.globalAlpha = frac * 0.35;
                        ctx.lineWidth   = frac * 1.5;
                        ctx.shadowColor  = nodes[i].color;
                        ctx.shadowBlur   = frac * 8;
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                        ctx.shadowBlur  = 0;
                    }
                }
                nodes[i].draw();
            }

            // Comets
            stars.forEach(s => { s.update(); s.draw(); });

            // Sparks
            sparks = sparks.filter(sp => sp.life > 0.05);
            sparks.forEach(sp => {
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.life -= 0.04;
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.life * 3, 0, Math.PI * 2);
                ctx.fillStyle = sp.color;
                ctx.globalAlpha = sp.life;
                ctx.shadowColor = sp.color;
                ctx.shadowBlur  = 12;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur  = 0;
            });

            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', init);
        init();
        loop();
    })();

    // Add the 3rd aura div dynamically
    const aura3 = document.createElement('div');
    aura3.className = 'bg-aura3';
    document.body.appendChild(aura3);
    </script>
</body>
</html>
